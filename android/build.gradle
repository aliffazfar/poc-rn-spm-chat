buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

def findNode() {
    def fromEnv = System.getenv("NODE_BINARY")
    if (fromEnv && file(fromEnv).exists()) return fromEnv
    def candidates = [
        "/opt/homebrew/bin/node",
        "/usr/local/bin/node",
        "/usr/bin/node"
    ]
    return candidates.find { file(it).exists() } ?: "node"
}

allprojects {
    plugins.withId("com.facebook.react") {
        react {
            nodeExecutableAndArgs = [findNode()]
        }
    }

    tasks.withType(Exec).configureEach {
        def currentPath = environment.PATH ?: System.getenv("PATH") ?: ""
        environment "PATH", "/opt/homebrew/bin:/usr/local/bin:${currentPath}"
    }
}
